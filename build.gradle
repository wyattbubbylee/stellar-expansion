plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = '0.1.0-dev'
group = 'com.stellarexpansion'
base { archivesName = 'stellar-expansion' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.208'
    runs {
        client { client() }
        server { server() }
    }
    mods {
        stellar_expansion { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
